name: infra-kit

services:
  postgres:
    image: postgres:16-alpine
    container_name: infra_kit_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: infra_kit_rabbitmq
    profiles: ["mq"]
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: infra_kit_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    container_name: infra_kit_adminer
    profiles: ["adminer"]
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: infra_kit_pgadmin
    profiles: ["pgadmin"]
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-changeme}
      PGADMIN_CONFIG_STORAGE_DIR: "'/var/lib/pgadmin/storage'"
      PGADMIN_CONFIG_FILE_MANAGER_STORAGE_PATH: "'/var/lib/pgadmin/storage'"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_ALLOW_SAVE_PASSWORD: "False"
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: "5"
      PGADMIN_CONFIG_X_FRAME_OPTIONS: "'SAMEORIGIN'"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./data/pgadmin/servers.json:/pgadmin4/servers.json:ro
    restart: always
    ports:
      - "8035:80"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: infra_kit_minio
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  victoria_metrics:
    image: victoriametrics/victoria-metrics:v1.137.0
    container_name: infra_kit_victoriametrics
    profiles: ["metrics"]
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-httpListenAddr=:8428"
    ports:
      - "${VICTORIA_METRICS_PORT:-8428}:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data

  victoria_logs:
    image: victoriametrics/victoria-logs:v1.48.0
    container_name: infra_kit_victoria_logs
    profiles: ["metrics"]
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
    ports:
      - "${VICTORIA_LOGS_PORT:-9428}:9428"
    volumes:
      - victoria_logs_data:/victoria-logs-data

  vmagent:
    image: victoriametrics/vmagent:v1.137.0
    container_name: infra_kit_vmagent
    profiles: ["metrics"]
    depends_on:
      - victoria_metrics
      - victoria_logs
    command:
      - "-promscrape.config=/etc/vmagent/prometheus.yml"
      - "-remoteWrite.url=${VMAGENT_REMOTE_WRITE_URL:-http://victoria_metrics:8428/api/v1/write}"
      - "-httpListenAddr=:8429"
    environment:
      VMAGENT_SCRAPE_JOB_NAME: ${VMAGENT_SCRAPE_JOB_NAME:-app}
      VMAGENT_SCRAPE_PATH: ${VMAGENT_SCRAPE_PATH:-/metrics}
      VMAGENT_SCRAPE_TARGET: ${VMAGENT_SCRAPE_TARGET:-host.docker.internal:8000}
    ports:
      - "${VMAGENT_PORT:-8429}:8429"
    volumes:
      - ./data/vmagent/prometheus.yml:/etc/vmagent/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.4.1
    container_name: infra_kit_grafana
    profiles: ["metrics"]
    depends_on:
      - victoria_metrics
      - victoria_logs
      - vmagent
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./data/grafana/provisioning:/etc/grafana/provisioning:ro

  vector:
    image: timberio/vector:0.40.1-alpine
    container_name: infra_kit_vector
    profiles: ["metrics"]
    depends_on:
      - victoria_logs
    command: ["--config", "/etc/vector/vector.toml"]
    environment:
      VECTOR_VICTORIA_LOGS_URI: ${VECTOR_VICTORIA_LOGS_URI:-http://victoria_logs:9428/insert/jsonline}
    volumes:
      - ./data/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  postgres_data:
    name: infra_kit_postgres_data
  redis_data:
    name: infra_kit_redis_data
  rabbitmq_data:
    name: infra_kit_rabbitmq_data
  pgadmin_data:
    name: infra_kit_pgadmin_data
  minio_data:
    name: infra_kit_minio_data
  victoriametrics_data:
    name: infra_kit_victoriametrics_data
  victoria_logs_data:
    name: infra_kit_victoria_logs_data
  grafana_data:
    name: infra_kit_grafana_data
